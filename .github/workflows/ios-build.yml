name: iOS build

on:
  push:
    branches: [main, local-first-beta, feature/health-foundation, feature/ux-navigation-shopping, feature/shopping-search-aliases, feature/shopping-favorites, feature/shopping-recurring-items, feature/calendar-event-details, feature/ios-app-icon-validation]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Familjen (iOS Simulator)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen librsvg

      - name: Render and validate app icon source
        run: |
          ICON_DIR="Sources/Assets.xcassets/AppIcon.appiconset"
          test -s "$ICON_DIR/AppIcon.svg"
          rsvg-convert -w 1024 -h 1024 "$ICON_DIR/AppIcon.svg" -o "$ICON_DIR/AppIcon.png"
          test -s "$ICON_DIR/AppIcon.png"
          DIMENSIONS="$(sips -g pixelWidth -g pixelHeight "$ICON_DIR/AppIcon.png")"
          echo "$DIMENSIONS"
          echo "$DIMENSIONS" | grep -q "pixelWidth: 1024"
          echo "$DIMENSIONS" | grep -q "pixelHeight: 1024"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Familjen.xcodeproj -scheme Familjen

      - name: Run unit tests
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$DEVICE_ID"
          xcodebuild \
            -project Familjen.xcodeproj \
            -scheme Familjen \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Familjen.xcodeproj \
            -scheme Familjen \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify compiled simulator app icon
        run: |
          APP_PATH="build-simulator/Build/Products/Debug-iphonesimulator/Familjen.app"
          test -d "$APP_PATH"
          test -s "$APP_PATH/Assets.car"
          xcrun assetutil --info "$APP_PATH/Assets.car" > /tmp/familjen-assets.json
          grep -q "AppIcon" /tmp/familjen-assets.json
          echo "Verified AppIcon rendition in compiled simulator asset catalog"

  build-device-ipa:
    name: Build unsigned IPA (iPhone)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen librsvg

      - name: Render and validate app icon source
        run: |
          ICON_DIR="Sources/Assets.xcassets/AppIcon.appiconset"
          test -s "$ICON_DIR/AppIcon.svg"
          rsvg-convert -w 1024 -h 1024 "$ICON_DIR/AppIcon.svg" -o "$ICON_DIR/AppIcon.png"
          test -s "$ICON_DIR/AppIcon.png"
          DIMENSIONS="$(sips -g pixelWidth -g pixelHeight "$ICON_DIR/AppIcon.png")"
          echo "$DIMENSIONS"
          echo "$DIMENSIONS" | grep -q "pixelWidth: 1024"
          echo "$DIMENSIONS" | grep -q "pixelHeight: 1024"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Familjen.xcodeproj -scheme Familjen

      - name: Build for physical iPhone (unsigned)
        run: |
          xcodebuild \
            -project Familjen.xcodeproj \
            -scheme Familjen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Familjen.app"
          test -d "$APP_PATH"
          echo "===== BUILT APP INFO.PLIST ====="
          /usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :UIRequiresFullScreen" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist" || true
          test -s "$APP_PATH/Assets.car"
          xcrun assetutil --info "$APP_PATH/Assets.car" > /tmp/familjen-assets.json
          grep -q "AppIcon" /tmp/familjen-assets.json
          echo "Verified AppIcon rendition in compiled iPhone asset catalog"
          echo "===== APP EXECUTABLE / BUNDLE ====="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleSupportedPlatforms" "$APP_PATH/Info.plist"
          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/
          cd package
          /usr/bin/zip -qry ../Familjen-unsigned.ipa Payload
          cd ..
          test -s Familjen-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Familjen-unsigned-IPA
          path: Familjen-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
