name: Familjen
options:
  bundleIdPrefix: se.familjen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: se.familjen.app
    INFOPLIST_KEY_CFBundleDisplayName: Familjen
    INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Familjen kan lägga till valda bokningar i din kalender.
    INFOPLIST_KEY_NSCalendarsUsageDescription: Familjen kan synkronisera valda bokningar med Apple Kalender.
targets:
  Familjen:
    type: application
    platform: iOS
    sources:
      - path: Sources
  FamiljenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Familjen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.familjen.tests

schemes:
  Familjen:
    build:
      targets:
        Familjen: all
        FamiljenTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FamiljenTests
