name: Familjen
options:
  bundleIdPrefix: se.familjen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_BUNDLE_IDENTIFIER: se.familjen.app
    INFOPLIST_KEY_CFBundleDisplayName: Familjen
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  Familjen:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Familjen kan lägga till valda bokningar i din kalender.
        INFOPLIST_KEY_NSCalendarsUsageDescription: Familjen kan synkronisera valda bokningar med Apple Kalender.
